services:
  synth:
    build: .
    restart: unless-stopped
    environment:
      # Coolify: routes this service's domain to port 3000 (set the domain in the Coolify UI).
      - SERVICE_FQDN_SYNTH_3000
      - PORT=3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "/synth", "health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
